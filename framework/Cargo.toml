[package]
name = "elyra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "A Rust + Svelte 5 framework for hyper-responsive desktop apps. Laravel-inspired, compiled, binary."
keywords = ["desktop", "gui", "webview", "svelte", "framework"]
categories = ["gui", "web-programming", "development-tools"]

[features]
# The window (RFC 0054): tao, wry and the system webview (WebKitGTK on
# Linux), the app menu, and the platform crates the shell uses. Off, the
# crate is an app without a window: commands, the container, events, the
# IPC layer and its test harness, codegen, migrations, `--mcp`, for a
# command-line twin built where no GTK or WebKit is installed.
default = ["gui"]
gui = [
    "dep:tao",
    "dep:wry",
    "dep:muda",
    "dep:webkit2gtk",
    "dep:gio",
    "dep:gtk",
    "dep:cairo-rs",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:block2",
    "dep:webview2-com",
]
# Database drivers + migrations (pulls in sqlx via elyra-db).
database = ["dep:elyra-db", "elyra-db/specta"]
# AI SDK (agents, tools, structured output, images, embeddings) via elyra-ai.
ai = ["dep:elyra-ai"]
# System tray icon + menu.
tray = ["gui", "dep:tray-icon"]
# Auto-updater (ed25519-verified).
updater = ["dep:ed25519-dalek", "dep:semver", "dep:ureq"]
# Native system integration: dialogs, shell-open, clipboard, notifications, paths.
system = ["gui", "dep:rfd", "dep:open", "dep:arboard", "dep:notify-rust", "dep:dirs"]
# OS-level global keyboard shortcuts.
shortcuts = ["gui", "dep:global-hotkey"]
# Launch the app at login.
autostart = ["dep:auto-launch"]
# OS keychain / credential manager for tokens + secrets.
secrets = ["dep:keyring", "dep:zeroize"]
# An HTTP client: `Http`, Laravel's facade (RFC 0005).
http = ["dep:reqwest", "dep:futures-util", "dep:mime_guess", "tokio/fs"]
# A Laravel backend: `Backend`, sign-in and its errors (RFC 0005).
backend = ["http", "secrets", "dep:tokio-tungstenite", "dep:futures-util", "dep:dirs"]
# The microphone (RFC 0032): native recording, handed over as a ChosenFile.
microphone = ["dep:cpal", "dep:dirs"]
# Spawn + manage sidecar child processes (no extra crate; enables tokio bits).
sidecar = ["tokio/process", "tokio/io-util"]

[dependencies]
elyra-db = { workspace = true, optional = true }
elyra-ai = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
# The updater's signatures, and a debug build's pictures for coding agents (RFC 0026).
base64 = { workspace = true }
# A debug build's picture of a window, scaled to CSS pixels (RFC 0026).
png = "0.18"
serde_json = { workspace = true }
substrate-core = { workspace = true, features = ["serde", "specta"] }
ureq = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
open = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
global-hotkey = { workspace = true, optional = true }
auto-launch = { workspace = true, optional = true }
parking_lot = { workspace = true }
jiff = { workspace = true }
regex-lite = { workspace = true }
sys-locale = { workspace = true }
elyra-macros = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
rmp = { workspace = true }
rmpv = { workspace = true }
tao = { workspace = true, optional = true }
wry = { workspace = true, optional = true }
# The IPC layer's requests and responses (the crate wry re-exports as
# `wry::http`), named directly so it doesn't need the window (RFC 0054).
http-types = { package = "http", version = "1" }
# `io-util` / `io-std` / `net`: the MCP server's line-framed stdio, and the
# private endpoint a running app serves it on (RFC 0003).
tokio = { workspace = true, features = ["io-util", "io-std", "net"] }
hmac = { workspace = true }
sha2 = { workspace = true }
rust-embed = { workspace = true }
thiserror = { workspace = true }
# `serde_json` types `serde_json::Value` (codegen names it `JsonValue`); feature
# unification gives apps that depend on specta the same.
specta = { workspace = true, features = ["serde_json"] }
specta-typescript = { workspace = true }
specta-serde = { workspace = true }
keyring = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# Native application menus. On macOS this is also what makes ⌘C/⌘V/⌘X reach the
# webview; on Windows/Linux it renders a per-window menu bar.
[dependencies.muda]
version = "0.19"
optional = true

# The tray's popover shows without bringing the app's other windows forward
# (RFC 0019). The versions tao uses already.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
optional = true
default-features = false
features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPrintInfo", "NSPrintOperation", "NSView", "objc2-core-foundation"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
optional = true
default-features = false
features = ["std", "NSArray", "NSString", "NSData", "NSDictionary", "NSValue", "NSError", "NSURL", "NSGeometry", "NSObject"]

# A debug build's picture of a window, for a coding agent (RFC 0026): the
# webview's own snapshot, from the crates wry uses already.
[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3"
optional = true
default-features = false
features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"]

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.webview2-com]
version = "0.38"
optional = true

# Exit hooks (RFC 0053): run before a signal ends the process, and end
# a sidecar's child by its id.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    # The diagnostics' memory figure (RFC 0033).
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # Exit hooks (RFC 0053): the console's events, the session's end.
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies.muda]
version = "0.19"
optional = true
features = ["gtk"]

[target.'cfg(target_os = "linux")'.dependencies.webkit2gtk]
version = "2.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.gio]
version = "0.18"
optional = true

# A page as a PDF (RFC 0062): WebKitGTK prints to GTK's file printer.
[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "0.18"
optional = true

# Images on the clipboard on Wayland too (RFC 0060).
[target.'cfg(target_os = "linux")'.dependencies.arboard]
workspace = true
optional = true
features = ["wayland-data-control"]

[target.'cfg(target_os = "linux")'.dependencies.cairo-rs]
version = "0.18"
optional = true
features = ["png"]

[dev-dependencies]
# Validates the MCP tool schemas against real serialized values.
jsonschema = { version = "0.30", default-features = false }
tokio = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
