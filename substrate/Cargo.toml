[package]
name = "substrate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Backend-agnostic Cache / Storage / Queue contracts shared across the Elyra + Askr ecosystem."
keywords = ["contracts", "cache", "storage", "queue", "traits"]
categories = ["caching", "data-structures", "development-tools"]

[dependencies]
# Both optional: the contract stays dependency-free unless a side wants
# `Page` to (de)serialize or to have a TypeScript type.
serde = { workspace = true, optional = true }
specta = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]
specta = ["dep:specta", "serde"]
