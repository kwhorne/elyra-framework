name: Publish @elyra/runtime

# Manual only: releases are tagged on GitHub and nothing is pushed to a registry
# as part of that. Run this workflow by hand if `@elyra/runtime` should go to npm
# (needs an NPM_TOKEN secret with publish rights on the @elyra scope).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish from (e.g. v0.5.7)"
        required: true
        default: main

jobs:
  npm:
    name: build · test · publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install
        working-directory: runtime
        run: npm ci
      - name: Verify the package version matches the tag
        if: startsWith(inputs.ref, 'v')
        working-directory: runtime
        run: |
          tag="${INPUT_REF#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg" >&2
            exit 1
          fi
        env:
          INPUT_REF: ${{ inputs.ref }}
      - name: Test + build
        working-directory: runtime
        run: |
          npm test
          npm run build
      - name: Publish
        working-directory: runtime
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
