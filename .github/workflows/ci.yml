name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A desktop framework has real per-platform code (deeplink registration,
        # autostart, config paths, the app menu): all three must compile and test.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps (webview, GTK, keychain, TLS)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # An app picks a few features, not all: code only one feature reads is
      # dead in the others, and the app's own build warns (0.22's live.rs did).
      - name: Clippy (the features an app picks)
        if: runner.os == 'macOS'
        run: |
          for features in database backend database,backend,system; do
            cargo clippy -p elyra --no-default-features --features "$features" -- -D warnings
          done
      # Broken intra-doc links pile up silently otherwise (23 had, by 0.6.0).
      - name: Docs
        if: runner.os == 'macOS'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Test
        run: cargo test --workspace --all-features
      # The shell without its optional features: what an app without a
      # Laravel backend answers its frontend (abilities, among others).
      - name: Test the shell without features
        if: runner.os == 'Linux'
        run: cargo test -p elyra --no-default-features --test shell
      # The inspector (RFC 0014) isn't compiled into a release: its routes
      # mustn't answer there, and its mask must mask nothing.
      - name: Test a release build has no inspector
        if: runner.os == 'Linux'
        run: cargo test --release -p elyra --no-default-features --test inspector_release

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      # The workspace declares rust-version = "1.94" (sqlx 0.9 sets the floor);
      # verify it actually builds, since the previously declared 1.80 did not.
      - run: cargo check --workspace --all-features

  audit:
    name: cargo deny (advisories · licenses · bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  scaffold:
    name: rata new smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build deps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      # `--elyra` links @elyra/runtime to this checkout's `runtime/` as a file:
      # dependency, and its package entry is `dist/` — build output a fresh
      # checkout doesn't have. Without this the frontend build below fails to
      # resolve the import.
      - name: Build @elyra/runtime (the scaffold links to it)
        working-directory: runtime
        run: |
          npm ci
          npm run build
      # A scaffolded project must actually build (it once pinned elyra = "0.1").
      - name: Scaffold against this checkout and build it
        run: |
          cargo run -p ratatosk -- new smoke --elyra "$PWD/framework" --dir /tmp
          cd /tmp/smoke
          cargo check
      # The frontend half of the template rots silently otherwise: the Vite
      # pin sat two majors behind before anyone noticed.
      - name: Build the scaffolded frontend
        working-directory: /tmp/smoke/app
        run: |
          npm install
          npm run build
      # `rata make:resource` end to end on a second, fresh scaffold: generate a
      # Team and a Customer that references it, then the generated tests,
      # clippy, fmt, a SQLite migrate/seed/rollback, codegen, the frontend
      # build, and the views in headless Chrome — so a broken template fails
      # here rather than for a user. Runs locally too.
      - name: make:resource smoke test
        env:
          SMOKE_REQUIRE_BROWSER: "1"
        run: |
          cargo build -p ratatosk
          cargo run -p ratatosk -- new resources --elyra "$PWD/framework" --dir /tmp
          scripts/smoke-resource.sh /tmp/resources target/debug/rata

  # The example app as an MCP server (RFC 0003), driven by the official MCP
  # Inspector's CLI: a client we didn't write lists the tools and resources,
  # makes a call that writes, reads it back, and is refused a tool that needs
  # the user's confirmation. Runs locally too.
  mcp:
    name: MCP inspector (example app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build deps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config jq
      - name: Build the example app
        run: cargo build -p elyra-example
      - name: Talk to it with the MCP Inspector
        run: scripts/mcp-inspector.sh target/debug/elyra-example

  # RFC 0005 and 0006 against a real Laravel app: Sanctum, the routes
  # docs/backend.md asks for and a customers apiResource that broadcasts
  # (scripts/laravel-backend.sh), served by `php artisan serve`. The tests sign
  # in, create, get Laravel's own 422s, page, update, delete and sign out over
  # real HTTP — then hear the web's changes through Reverb and through Askr.
  laravel:
    name: Laravel backend (real app)
    # Askr's Linux build links libicu74 and friends: Ubuntu 24.04's.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Install build deps
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      - name: A Laravel app to talk to
        run: scripts/laravel-backend.sh "$RUNNER_TEMP/api"
      - name: Sign in, CRUD, 422s, paging, sign out
        run: |
          # Reverb too: a customer broadcasts its changes (synchronously), so
          # Laravel's writes fail without it.
          (cd "$RUNNER_TEMP/api" && php artisan serve --port=8765 >"$RUNNER_TEMP/serve.log" 2>&1 &)
          (cd "$RUNNER_TEMP/api" && php artisan reverb:start --port=8080 >"$RUNNER_TEMP/reverb.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/up && break; sleep 1; done
          for _ in $(seq 1 30); do (echo >/dev/tcp/127.0.0.1/8080) 2>/dev/null && break; sleep 1; done
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 \
            cargo test -p elyra --features backend --test laravel_backend -- --nocapture
      # RFC 0007: offline against the real app, through a proxy the test pulls
      # the plug on — a write made meanwhile is sent once, a repeated key is
      # answered from Laravel's record, a stale update is a 412.
      - name: Working offline (the outbox)
        run: |
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 \
            cargo test -p elyra --features backend,database --test laravel_offline -- --nocapture
      # RFC 0010: each user's abilities from spatie's permissions through
      # elyracode/elyra-backend (installed from this repository); a command
      # the user may not run is refused before any request; a permission
      # given on the web reaches the desktop through Reverb.
      - name: Abilities through Reverb
        run: |
          key=$(grep '^REVERB_APP_KEY=' "$RUNNER_TEMP/api/.env" | cut -d= -f2)
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 ELYRA_PUSHER="$key@127.0.0.1:8080" \
            cargo test -p elyra --features backend,database --test laravel_abilities -- --nocapture
      # RFC 0011: the desktop's assistant reaches Claude through
      # Route::elyraAssistant(), which adds the server's key and caps the
      # model, max_tokens, server tools and requests per user. Anthropic is
      # the test's own stand-in on 8766.
      - name: The assistant through Laravel
        run: |
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 ELYRA_ASSISTANT_UPSTREAM=127.0.0.1:8766 \
            cargo test -p elyra --features ai,backend --test laravel_assistant -- --nocapture
      # RFC 0009: a customer's contract goes up as an upload beside the form
      # (a PUT as a POST with _method), comes back as a download, is refused
      # on its field by Laravel's 422, and one made offline is sent from its
      # copy once the network is back.
      - name: Files (uploads and downloads)
        run: |
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 \
            cargo test -p elyra --features backend,database --test laravel_files -- --nocapture
      # RFC 0006: a customer created on the web reaches the desktop app's open
      # list, broadcast by Laravel through Reverb (its default) and then
      # through Askr's --pusher (the web half Elyra pairs with).
      - name: Broadcasting through Reverb
        run: |
          key=$(grep '^REVERB_APP_KEY=' "$RUNNER_TEMP/api/.env" | cut -d= -f2)
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 ELYRA_PUSHER="$key@127.0.0.1:8080" \
            cargo test -p elyra --features backend,database --test laravel_broadcasting -- --nocapture
      # RFC 0008: a customer created on the web notifies the user; the desktop
      # app shows it in the OS, and reading it on either side reads it on the
      # other.
      - name: Notifications through Reverb
        run: |
          key=$(grep '^REVERB_APP_KEY=' "$RUNNER_TEMP/api/.env" | cut -d= -f2)
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 ELYRA_PUSHER="$key@127.0.0.1:8080" \
            cargo test -p elyra --features backend,database --test laravel_notifications -- --nocapture
      - name: Broadcasting through Askr (--pusher)
        env:
          ASKR_VERSION: "1.8.2"
          # Pinned here, not read from the release: a replaced asset fails.
          ASKR_SHA256: db33339b1aa00d9166cf35c018d7477f0f791e145c607900837d6f2805281d35
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          tarball="askr-$ASKR_VERSION-linux-x86_64.tar.gz"
          gh release download "v$ASKR_VERSION" -R kwhorne/askr -p "$tarball"
          echo "$ASKR_SHA256  $tarball" | sha256sum -c -
          tar xzf "$tarball"
          # libphp's own libraries, as Askr's INSTALL.txt lists them.
          sudo apt-get install -y -qq --no-install-recommends libssl3 libxml2 libonig5 \
            libsqlite3-0 libicu74 libcurl4 libpng16-16 libjpeg-turbo8 libfreetype6 libwebp7 \
            libzip4 libpq5 zlib1g >/dev/null
          mkdir -p askr-root && echo '<?php echo "askr";' >askr-root/index.php
          secret=$(grep '^REVERB_APP_SECRET=' api/.env | cut -d= -f2)
          ("askr-$ASKR_VERSION-linux-x86_64/askr" serve --root askr-root --listen 127.0.0.1:8090 \
            --workers 1 --pusher --pusher-secret "$secret" >askr.log 2>&1 &)
          for _ in $(seq 1 30); do (echo >/dev/tcp/127.0.0.1/8090) 2>/dev/null && break; sleep 1; done
          # Laravel's reverb connection, pointed at Askr — as Askr's docs say.
          # `artisan serve` restarts itself when .env changes, dropping requests
          # meanwhile: stop it first, and start it again once .env is final.
          pkill -f 'artisan serve' || true
          pkill -f 'php -S 127.0.0.1:8765' || true
          for _ in $(seq 1 30); do (echo >/dev/tcp/127.0.0.1/8765) 2>/dev/null || break; sleep 1; done
          sed -i 's/^REVERB_PORT=.*/REVERB_PORT=8090/; s/^REVERB_HOST=.*/REVERB_HOST="127.0.0.1"/' api/.env
          (cd api && php artisan config:clear)
          (cd api && php artisan serve --port=8765 >"$RUNNER_TEMP/serve.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/up && break; sleep 1; done
          key=$(grep '^REVERB_APP_KEY=' api/.env | cut -d= -f2)
          cd "$GITHUB_WORKSPACE"
          ELYRA_LARAVEL_URL=http://127.0.0.1:8765 ELYRA_PUSHER="$key@127.0.0.1:8090" \
            cargo test -p elyra --features backend,database --test laravel_broadcasting -- --nocapture || {
              echo "--- askr.log"; tail -40 "$RUNNER_TEMP/askr.log"; exit 1; }

  runtime:
    name: runtime (typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            ui/package-lock.json
      - name: Install
        working-directory: runtime
        run: npm ci
      - name: Typecheck
        working-directory: runtime
        run: npm run typecheck
      - name: Test
        working-directory: runtime
        run: npm test
      - name: Build (dist + .d.ts)
        working-directory: runtime
        run: npm run build
      # @elyra/ui (RFC 0012): its components and tokens, and that the runtime's
      # built-ins read them. The reference's pages match their examples, and
      # the docs site (every example) builds.
      - name: "@elyra/ui: install and test"
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run docs:sync -- --check
          npm run docs:build
          npm pack --dry-run

  database:
    name: model tests (MySQL + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elyra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      ELYRA_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/elyra_test
      ELYRA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/elyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps (webview + TLS)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          # libxdo is required since the app menu (muda) became cross-platform.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libssl-dev pkg-config
      - name: Model CRUD against real MySQL + Postgres
        run: cargo test -p elyra --features database,backend --test model_servers -- --nocapture
