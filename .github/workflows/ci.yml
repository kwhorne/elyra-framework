name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A desktop framework has real per-platform code (deeplink registration,
        # autostart, config paths, the app menu): all three must compile and test.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps (webview, GTK, keychain, TLS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      # The workspace declares rust-version = "1.94" (sqlx 0.9 sets the floor);
      # verify it actually builds, since the previously declared 1.80 did not.
      - run: cargo check --workspace --all-features

  audit:
    name: cargo deny (advisories · licenses · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  scaffold:
    name: rata new smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev libssl-dev pkg-config
      # A scaffolded project must actually build (it once pinned elyra = "0.1").
      - name: Scaffold against this checkout and build it
        run: |
          cargo run -p ratatosk -- new smoke --elyra "$PWD/framework" --dir /tmp
          cd /tmp/smoke
          cargo check
      # The frontend half of the template rots silently otherwise: the Vite
      # pin sat two majors behind before anyone noticed.
      - name: Build the scaffolded frontend
        working-directory: /tmp/smoke/app
        run: |
          npm install
          npm run build

  runtime:
    name: runtime (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install
        working-directory: runtime
        run: npm ci
      - name: Typecheck
        working-directory: runtime
        run: npm run typecheck
      - name: Test
        working-directory: runtime
        run: npm test
      - name: Build (dist + .d.ts)
        working-directory: runtime
        run: npm run build

  database:
    name: model tests (MySQL + Postgres)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elyra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      ELYRA_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/elyra_test
      ELYRA_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/elyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps (webview + TLS)
        run: |
          sudo apt-get update
          # libxdo is required since the app menu (muda) became cross-platform.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libssl-dev pkg-config
      - name: Model CRUD against real MySQL + Postgres
        run: cargo test -p elyra --features database --test model_servers -- --nocapture
