name: Linux build deps
description: >
  The packages a Linux build of Elyra links (webview, GTK, tray, keychain,
  TLS, ALSA for the microphone), installed from a cache of their .deb files: Ubuntu's mirror has timed
  out the install (10 minutes, a 25 MB libwebkit2gtk at a few KB/s) on
  otherwise green runs. On a hit apt downloads nothing; a package the mirror
  has updated since is fetched alone. Every job installs the same list, so
  they share one cache, and its key follows the runner image. When Ubuntu
  has updated a big package since (libwebkit2gtk, 25 MB) the mirror can
  still slow to a trickle: the downloads are tried a few minutes at a time,
  resuming what came, before anything is installed.
runs:
  using: composite
  steps:
    # The runner's own variables aren't in the `env` context.
    - name: The runner image
      id: image
      shell: bash
      run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: The .deb files from an earlier run
      uses: actions/cache@v4
      with:
        path: ~/apt-archives
        key: apt-${{ steps.image.outputs.name }}-${{ hashFiles('.github/actions/linux-deps/action.yml') }}
        # A new image starts from the last one's files: only what changed is
        # downloaded.
        restore-keys: |
          apt-
    - name: Install
      shell: bash
      run: |
        archives="$HOME/apt-archives"
        mkdir -p "$archives/partial"
        # Retry a stalled download rather than wait on it.
        net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        keep=(-o Dir::Cache::Archives="$archives" -o APT::Keep-Downloaded-Packages=true)
        packages=(libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          libxdo-dev libdbus-1-dev libssl-dev libasound2-dev pkg-config jq xvfb)
        # apt's own timeout is for a mirror that sends nothing; one that sends
        # 58 kB/s (it has, for 34 MB) is only left by stopping it. A fresh
        # connection usually lands somewhere faster, and partial/ keeps what
        # came, so the next try resumes it.
        try() {
          local what=$1; shift
          for attempt in 1 2 3; do
            sudo timeout 120 "$@" && return 0
            echo "::warning::apt: $what stalled or failed (try $attempt of 3)"
          done
          echo "::error::apt: $what didn't finish in 3 tries of 2 minutes"
          return 1
        }
        try "update" apt-get "${net[@]}" update
        try "downloading the build deps" \
          apt-get "${net[@]}" "${keep[@]}" install -y --download-only "${packages[@]}"
        # Everything is here now: installing doesn't touch the network.
        sudo apt-get "${keep[@]}" install -y --no-download "${packages[@]}"
        # Versions the mirror no longer has: the cache mustn't grow with them.
        sudo apt-get "${keep[@]}" autoclean
        # apt's lock and partial downloads are root's; the cache is saved as
        # the runner's user.
        sudo rm -rf "$archives/lock" "$archives/partial"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        echo "apt archives: $(find "$archives" -name '*.deb' | wc -l) .deb files, $(du -sh "$archives" | cut -f1)"
